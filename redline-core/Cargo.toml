[package]
name = "redline-core"
version = "0.1.0"
edition = "2024"
description = "Redline's working parts (yt-dlp, ffmpeg, the job queue), with no UI dependency"

[dependencies]
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "tga", "qoi", "avif"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rtrb = "0.4.0"

# Desktop integration. Android hands Redline its folders and does the rest in Kotlin.
[target.'cfg(not(target_os = "android"))'.dependencies]
directories = "6"
open = "5"
trash = "5"
notify-rust = "4"
# The player's sound output. Android's goes straight to AAudio instead.
cpal = "0.18.2"

[target.'cfg(target_os = "android")'.dependencies]
# AAudio for the player's output (see player/aaudio.rs); the version cpal would use.
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-26"] }

[target.'cfg(windows)'.dependencies]
# Windows media keys and the media overlay (SMTC)
souvlaki = "0.8.3"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power"] }
