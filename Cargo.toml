[workspace]
members = [".", "redline-core"]

[package]
name = "redline"
version = "0.1.0"
edition = "2024"
description = "Download media with yt-dlp and convert local files, in a Spotify-style egui app"

[dependencies]
redline-core = { path = "redline-core" }
# pinned to 0.36 to match egui-phosphor 0.14
eframe = "0.36"
egui_extras = { version = "0.36", features = ["http", "image"] }
egui-phosphor = "0.14"
rfd = "0.17"
open = "5"
anyhow = "1"

[profile.release]
opt-level = 3
strip = true

# rav1e (AVIF encoder) is painfully slow unoptimized
[profile.dev.package."*"]
opt-level = 2
