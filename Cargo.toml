[workspace]
members = [".", "redline-core", "redline-mobile"]

[package]
name = "redline"
version = "0.1.5"
edition = "2024"
description = "Download media with yt-dlp and convert local files, in a Spotify-style egui app"

[dependencies]
redline-core = { path = "redline-core" }
# pinned to 0.36 to match egui-phosphor 0.14
eframe = "0.36"
egui_extras = { version = "0.36", features = ["http", "image", "file"] }
egui-phosphor = "0.14"
rfd = "0.17"
open = "5"
anyhow = "1"
# The window handle for Windows media keys; the version eframe uses
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
strip = true

# rav1e (AVIF encoder) is painfully slow unoptimized
[profile.dev.package."*"]
opt-level = 2

# The Android app's debug build (android/app/build.gradle.kts builds with it): the dev profile
# without debuginfo, which made libredline_mobile.so ~150 MB per ABI (line tables alone, 56 MB).
# The symbol table stays, so a backtrace still names its functions, and a panic's message
# carries its file and line either way.
[profile.android-dev]
inherits = "dev"
debug = false
